[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-english-tutor"
version = "0.2.0"
description = "Local, offline AI English conversation tutor (faster-whisper + Ollama + Piper)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2,<2",
    "customtkinter>=5.2,<6",
    "sounddevice>=0.5",
    "numpy>=2",
    "scipy>=1.13",
    "requests>=2.32",
    "keyboard>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
english-tutor = "english_tutor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
